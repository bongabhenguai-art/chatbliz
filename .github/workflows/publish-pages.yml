name: Publish Chatbliz static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Prepare public artifact
        run: |
          mkdir -p public
          cp index.html styles.css public/
          if [ -f app.js ]; then cp app.js public/; fi
          if [ -f script.js ]; then cp script.js public/; fi
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.webp' \) -exec cp {} public/ \;
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
