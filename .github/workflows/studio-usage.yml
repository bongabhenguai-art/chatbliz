name: Studio usage concurrency
on:
  pull_request:
  workflow_dispatch:
jobs:
  postgres-studio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbliz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chatbliz_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock pg@8
      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/001_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/002_customer_access.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/003_task_event_integrity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/004_studio_usage.sql
      - name: Test concurrent Studio reservations
        run: |
          node scripts/integration/studio-usage.mjs
          node scripts/integration/studio-lifecycle.mjs
