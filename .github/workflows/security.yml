name: Chatbliz security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find src -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
          node --check server.mjs
      - name: Run application tests
        run: npm test
      - name: Audit declared dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo 'No package-lock.json: dependency audit is not applicable to this dependency-free repository.'
          fi
